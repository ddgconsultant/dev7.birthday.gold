<!DOCTYPE html>
<html>
<head>
    <title>Confetti Debug Test</title>
    <style>
        body {
            background: #28a745;
            margin: 0;
            padding: 20px;
            height: 100vh;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: red;
            z-index: 9999;
            animation: confetti-fall linear infinite;
        }
        
        @keyframes confetti-fall {
            from {
                top: -10px;
                transform: rotate(0deg);
            }
            to {
                top: 100vh;
                transform: rotate(360deg);
            }
        }
        
        .test-info {
            color: white;
            font-family: Arial;
            font-size: 18px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h1>Confetti Debug Test</h1>
        <p>If you see red squares falling, confetti works.</p>
        <p>If they stick at top, something is preventing animation.</p>
        <button onclick="addConfetti()">Add More Confetti</button>
        <button onclick="inspectConfetti()">Inspect Confetti</button>
    </div>

    <script>
        function addConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.backgroundColor = '#ff0000';
            confetti.style.animationDuration = '3s';
            
            document.body.appendChild(confetti);
            console.log('Added confetti element:', confetti);
            
            setTimeout(() => {
                if (confetti.parentNode) {
                    confetti.parentNode.removeChild(confetti);
                }
            }, 3500);
        }
        
        function inspectConfetti() {
            const confettiElements = document.querySelectorAll('.confetti');
            console.log('Found confetti elements:', confettiElements.length);
            confettiElements.forEach((el, i) => {
                const computed = window.getComputedStyle(el);
                console.log(`Confetti ${i}:`, {
                    top: computed.top,
                    position: computed.position,
                    animation: computed.animation,
                    animationName: computed.animationName,
                    animationDuration: computed.animationDuration,
                    transform: computed.transform,
                    zIndex: computed.zIndex
                });
            });
        }
        
        // Auto-start
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Starting debug confetti test');
            for (let i = 0; i < 5; i++) {
                setTimeout(() => addConfetti(), i * 500);
            }
        });
    </script>
</body>
</html>
