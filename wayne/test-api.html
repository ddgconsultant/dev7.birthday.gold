<!DOCTYPE html>
<html>
<head>
    <title>Test Anthropic API</title>
</head>
<body>
    <h1>Test Anthropic API</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
    async function testAPI() {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = 'Testing...';
        
        try {
            const response = await fetch('api/chat.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: "Hello! What is today's date?",
                    apiKey: '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',
                    provider: 'anthropic',
                    model: 'claude-opus-4-20250514',
                    history: []
                })
            });
            
            const data = await response.json();
            console.log('Response:', data);
            
            if (data.success) {
                resultDiv.innerHTML = '<h3>Success!</h3><p>' + data.response + '</p>';
            } else {
                resultDiv.innerHTML = '<h3>Error:</h3><p>' + data.error + '</p>';
            }
        } catch (error) {
            resultDiv.innerHTML = '<h3>Error:</h3><p>' + error.message + '</p>';
        }
    }
    </script>
</body>
</html>
